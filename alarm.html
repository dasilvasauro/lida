<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alarme · Lida</title>
<!-- Tela do alarme. Usada pelo app Android (atividade de tela cheia, mesmo com o celular bloqueado),
     pelo app do Linux e pela web (por cima do app, num iframe). Recebe tudo pelo #fragmento (JSON):
     { title, desc, kind, tone, sound, style: 'theme'|'amoled', vars: {...cores do tema}, font, lang, t: {textos} }
     Respostas: LidaAlarmNative.done()/ignore() no Android; postMessage({ lidaAlarm: 'done'|'ignore' }) no resto. -->
<style>
@font-face { font-family: 'Manrope'; src: url('fonts/manrope.woff2') format('woff2'); font-weight: 200 800; }
@font-face { font-family: 'Inter'; src: url('fonts/inter.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Nunito'; src: url('fonts/nunito.woff2') format('woff2'); font-weight: 200 1000; }
@font-face { font-family: 'Lexend'; src: url('fonts/lexend.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'VT323'; src: url('fonts/vt323.woff2') format('woff2'); font-weight: 400; size-adjust: 128%; }
@font-face { font-family: 'Lora'; src: url('fonts/lora.woff2') format('woff2'); font-weight: 400 700; }
@font-face { font-family: 'Atkinson Hyperlegible'; src: url('fonts/atkinson-400.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Atkinson Hyperlegible'; src: url('fonts/atkinson-700.woff2') format('woff2'); font-weight: 700; }
:root { --bg: #0f1217; --surface: #171b22; --surface-2: #1f242d; --text: #f2f4f8; --muted: #a3abba; --accent: #8c97ff; --on-accent: #0f1217; --line: #2a303b; --font: 'Manrope', system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
/* Limpa: hora grande, o nome, a descrição e dois botões. Nada mais. */
.wrap { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: max(7vh, calc(env(safe-area-inset-top) + 3vh)) 7vw max(5vh, calc(env(safe-area-inset-bottom) + 3vh)); gap: 3vh; }
.top { display: grid; justify-items: center; gap: .6vh; text-align: center; }
.clock { font-size: clamp(72px, min(26vw, 20vh), 260px); font-weight: 700; line-height: .95; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.clock small { font-size: .26em; font-weight: 600; letter-spacing: 0; margin-left: .2em; vertical-align: .95em; opacity: .7; }
.date { color: var(--muted); font-size: clamp(15px, 2.3vh, 21px); font-weight: 500; }
.mid { display: grid; align-content: center; justify-items: center; gap: 1.6vh; min-height: 0; text-align: center; }
.kind { color: var(--muted); font-size: clamp(12px, 1.8vh, 16px); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.title { font-size: clamp(30px, min(9vw, 6.8vh), 76px); font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.desc { color: var(--muted); font-size: clamp(16px, min(4.4vw, 2.7vh), 25px); line-height: 1.45; max-height: 28vh; overflow-y: auto; white-space: pre-line; overflow-wrap: anywhere; }
.desc:empty { display: none; }
.btns { display: grid; grid-template-columns: 1fr; gap: 1.2vh; }
button { appearance: none; -webkit-appearance: none; border: 0; outline: 0; border-radius: 999px; min-height: clamp(64px, 10.5vh, 116px); font: inherit; font-size: clamp(20px, min(5.8vw, 3.4vh), 34px); font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .45em; transition: transform .12s, opacity .12s; }
button:focus, button:focus-visible { outline: 0; }
button:active { transform: scale(.97); opacity: .85; }
button svg { width: 1.05em; height: 1.05em; }
.done { background: var(--accent); color: var(--on-accent); }
.ignore { background: none; color: var(--muted); min-height: clamp(52px, 8vh, 90px); }
@media (min-aspect-ratio: 4/3) { .btns { grid-template-columns: 1fr 1fr; } .ignore { min-height: clamp(64px, 10.5vh, 116px); } }
/* "LED": vermelho puro, sem brilho em volta e sem esmaecer; acende e apaga seco, como um LED de aparelho */
.led { position: fixed; top: max(3vh, calc(env(safe-area-inset-top) + 10px)); right: 7vw; width: clamp(16px, 2.6vh, 26px); height: clamp(16px, 2.6vh, 26px); border-radius: 50%; background: #ff0000; animation: led 1s steps(1, end) infinite; }
@keyframes led { 50% { visibility: hidden; } }
/* AMOLED: preto puro, branco e cinza */
body.amoled { --bg: #000; --text: #fff; --muted: #8c8c8c; --accent: #fff; --on-accent: #000; --line: #262626; }
body.amoled .clock { font-weight: 300; }
body.amoled .title { font-weight: 600; }
body.amoled .led { width: clamp(20px, 3.4vh, 34px); height: clamp(20px, 3.4vh, 34px); }
</style>
</head>
<body>
<i class="led" aria-hidden="true"></i>
<div class="wrap">
  <div class="top"><div class="clock" id="clock">00:00</div><div class="date" id="date"></div></div>
  <div class="mid"><span class="kind" id="kind"></span><h1 class="title" id="title"></h1><p class="desc" id="desc"></p></div>
  <div class="btns">
    <button class="done" id="done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="doneTxt"></span></button>
    <button class="ignore" id="ignore"><span id="ignoreTxt"></span></button>
  </div>
</div>
<audio id="snd" loop></audio>
<script>
(function () {
  var p = {};
  try { p = JSON.parse(decodeURIComponent(location.hash.slice(1)) || '{}'); } catch (e) {}
  var T = p.t || {};
  var root = document.documentElement;
  if (p.style === 'amoled') document.body.classList.add('amoled');
  else for (var k in (p.vars || {})) root.style.setProperty(k, p.vars[k]);
  if (p.font) root.style.setProperty('--font', p.font);
  if (p.lang) root.lang = p.lang;
  document.getElementById('kind').textContent = T.kind || 'Alarme';
  document.getElementById('title').textContent = p.title || '';
  document.getElementById('desc').textContent = p.desc || '';
  document.getElementById('doneTxt').textContent = T.done || 'Concluir';
  document.getElementById('ignoreTxt').textContent = T.ignore || 'Ignorar';
  document.title = (p.title || 'Alarme') + ' · Lida';
  var loc = p.locale || 'pt-BR';
  function tick() {
    var d = new Date();
    // AM/PM (inglês) menor, ao lado: o relógio grande fica só com os números
    var parts = new Intl.DateTimeFormat(loc, { hour: '2-digit', minute: '2-digit' }).formatToParts(d);
    var main = '', ap = '';
    parts.forEach(function (x) { if (x.type === 'dayPeriod') ap = x.value; else main += x.value; });
    var clock = document.getElementById('clock');
    clock.textContent = main.trim();
    if (ap) { var sm = document.createElement('small'); sm.textContent = ap; clock.appendChild(sm); }
    var s = d.toLocaleDateString(loc, { weekday: 'long', day: 'numeric', month: 'long' });
    document.getElementById('date').textContent = s.charAt(0).toUpperCase() + s.slice(1);
  }
  tick();
  setInterval(tick, 1000);
  var snd = document.getElementById('snd');
  if (p.sound) {
    snd.src = p.sound;
    snd.volume = 1;
    var play = function () { snd.play().catch(function () {}); };
    play();
    document.addEventListener('pointerdown', play, { once: true });
  }
  function send(a) {
    try { snd.pause(); } catch (e) {}
    if (window.LidaAlarmNative) { a === 'done' ? window.LidaAlarmNative.done() : window.LidaAlarmNative.ignore(); return; }
    try { parent.postMessage({ lidaAlarm: a, key: p.key }, '*'); } catch (e) {}
  }
  document.getElementById('done').onclick = function () { send('done'); };
  document.getElementById('ignore').onclick = function () { send('ignore'); };
  if (navigator.vibrate && p.vibrate) { navigator.vibrate([600, 400, 600, 400, 600]); }
})();
</script>
</body>
</html>
