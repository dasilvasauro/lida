apply plugin: 'com.android.application'

// Variante do APK (ver scripts/flavor.mjs):
//   google  (padrão) login com Google + Firestore, atualizador dentro do app (Releases do GitHub)
//   libre   sem Google nem Firebase, id próprio, atualizador dentro do app (lida-libre.apk da Release)
//   fdroid  igual à libre, sem atualizador (quem atualiza é o F-Droid)
// Vem do arquivo flavor.properties (escrito pelo scripts/flavor.mjs) ou da variável LIDA_FLAVOR.
def flavorProps = new Properties()
def flavorFile = rootProject.file('flavor.properties')
if (flavorFile.exists()) flavorFile.withInputStream { flavorProps.load(it) }
def lidaFlavor = (flavorProps.getProperty('flavor') ?: System.getenv('LIDA_FLAVOR') ?: 'google').trim()
def isLibre = lidaFlavor == 'libre' || lidaFlavor == 'fdroid'

// Versão: android/version.properties (gerado por scripts/version.mjs a partir do package.json).
def versionProps = new Properties()
rootProject.file('version.properties').withInputStream { versionProps.load(it) }

android {
    namespace = "io.github.dasilvasauro.lida"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId(isLibre ? "io.github.dasilvasauro.lida.libre" : "io.github.dasilvasauro.lida")
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode(versionProps.getProperty('versionCode') as int)
        // Compilações fora de tag (Actions) ganham "-dev.N" no nome; o código fica o da versão.
        def devBuild = System.getenv("LIDA_DEV_BUILD")
        versionName(versionProps.getProperty('versionName') + (devBuild ? "-dev.${devBuild}" : ""))
        // Atualizador dentro do app (baixa a Release do GitHub). Desligado na variante do F-Droid.
        buildConfigField "boolean", "LIDA_UPDATER", (lidaFlavor == "fdroid" ? "false" : "true")
        buildConfigField "String", "LIDA_FLAVOR", "\"${isLibre ? 'libre' : 'google'}\""
        resValue "string", "app_name", (isLibre ? "Lida Libre" : "Lida")
        resValue "string", "title_activity_main", (isLibre ? "Lida Libre" : "Lida")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    // Assinatura do APK de release: a chave vem dos segredos do repositório (ver README, "APK").
    // Sempre a mesma chave, para o Android aceitar atualizações por cima da versão instalada.
    signingConfigs {
        release {
            def ks = System.getenv("LIDA_KEYSTORE_PATH")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("LIDA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("LIDA_KEY_ALIAS")
                keyPassword System.getenv("LIDA_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("LIDA_KEYSTORE_PATH")) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Sincronização com a nuvem da pessoa (Dropbox, OneDrive, WebDAV): HTTP com PROPFIND/MKCOL.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// <google> (a variante Libre apaga este bloco: scripts/flavor.mjs)
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
// </google>
